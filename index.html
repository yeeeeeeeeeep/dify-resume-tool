<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI简历优化助手 | 求职工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        neutral: '#f3f4f6',
                        dark: '#1f2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-shadow {
                box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-dark">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- 头部标题 -->
        <div class="text-center mb-10">
            <h1 class="text-[clamp(1.75rem,3vw,2.5rem)] font-bold text-primary mb-2">AI简历优化助手</h1>
            <p class="text-gray-500">上传简历 & JD，自动匹配岗位，生成优化后的简历（支持 Docx / PDF / PNG）</p>
        </div>

        <div class="bg-white rounded-xl p-6 md:p-8 card-shadow">
            <form id="resumeForm" class="space-y-6">
                <!-- 简历 JL -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-file-text-o mr-1 text-primary"></i> 简历 JL
                    </label>
                    <p class="text-sm text-gray-400 mb-2">上传你的原始简历（PDF/Word）</p>
                    <input type="file" id="JL" name="JL" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                </div>

                <!-- JD 文件 -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-file-text mr-1 text-primary"></i> 岗位JD文件（选填）
                    </label>
                    <p class="text-sm text-gray-400 mb-2">上传JD文档，和JD链接二选一即可</p>
                    <input type="file" id="JD" name="JD" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                </div>

                <!-- JD网页链接 【重点：这里name改成 JD_fenjie，和Dify对齐】 -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-link mr-1 text-primary"></i> JD网页链接（选填）
                    </label>
                    <p class="text-sm text-gray-400 mb-2">招聘网页链接，会自动抓取岗位描述</p>
                    <input type="url" id="JD_fenjie" name="JD_fenjie" placeholder="粘贴招聘网页链接" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                </div>

                <!-- 岗位名 -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-briefcase mr-1 text-primary"></i> 岗位名称
                    </label>
                    <p class="text-sm text-gray-400 mb-2">例如：AI产品经理、前端开发</p>
                    <input type="text" id="JD_name" name="JD_name" placeholder="填写目标岗位名称" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                </div>

                <!-- 输出类型下拉 -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-download mr-1 text-primary"></i> 简历输出类型
                    </label>
                    <p class="text-sm text-gray-400 mb-2">选择你想要导出的文件格式</p>
                    <select id="JL_output_type" name="JL_output_type" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                        <option value="docx">docx Word文档（推荐）</option>
                        <option value="PDF">PDF 文件</option>
                        <option value="PNG">PNG 图片</option>
                    </select>
                </div>

                <!-- JL模板 -->
                <div>
                    <label class="block text-base font-semibold mb-2 text-gray-700">
                        <i class="fa fa-file-o mr-1 text-primary"></i> 简历模板 JL模板（选填）
                    </label>
                    <p class="text-sm text-gray-400 mb-2">上传参考模板，AI对齐排版风格</p>
                    <input type="file" id="JL_example" name="JL_example" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary input-shadow">
                </div>

                <!-- 提交按钮 -->
                <div class="pt-2">
                    <button id="submitBtn" type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 rounded-lg transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa fa-magic"></i> 开始优化简历
                    </button>
                </div>
            </form>

            <!-- 结果区域 -->
            <div id="resultArea" class="mt-8 hidden">
                <hr class="my-6 border-gray-100">
                <h3 class="font-semibold text-lg mb-3 text-gray-700">✅ 优化结果</h3>
                <div id="resultContent" class="bg-slate-50 p-4 rounded-lg whitespace-pre-wrap text-sm"></div>
                <div id="downloadBox" class="mt-4 hidden">
                    <a id="downloadLink" href="" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg">
                        <i class="fa fa-download mr-1"></i> 下载文件
                    </a>
                </div>
            </div>
        </div>
        <div class="text-center mt-6 text-gray-400 text-sm">
            基于Dify工作流 · AI简历求职助手
        </div>
    </div>

    <script>
        const form = document.getElementById('resumeForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');
        const downloadBox = document.getElementById('downloadBox');
        const downloadLink = document.getElementById('downloadLink');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> 正在处理，请稍候...`
            resultArea.classList.add('hidden');
            downloadBox.classList.add('hidden');

            const formData = new FormData(form);
            try {
                // ✅ 修改接口地址为 /api/run-workflow 和后端对齐
                const res = await fetch('/api/run-workflow', {
                    method: 'POST',
                    body: formData
                })
                const data = await res.json();
                resultArea.classList.remove('hidden');
                resultContent.innerText = data.text || JSON.stringify(data, null, 2);
                if(data.fileUrl) {
                    downloadBox.classList.remove('hidden');
                    downloadLink.href = data.fileUrl;
                }
            } catch(err) {
                resultArea.classList.remove('hidden');
                resultContent.innerText = '请求出错：' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa fa-magic"></i> 开始优化简历`
            }
        })
    </script>
</body>
</html>
